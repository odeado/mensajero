<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#202c33">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chat">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Chat 💬</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/extra.css">
  <link rel="stylesheet" href="css/fun.css">
</head>
<body>

  <!-- Cargando -->
  <div id="loading" class="modal-overlay">
    <div class="brand-icon">💬</div>
  </div>

  <!-- Login -->
  <div id="login-screen" class="modal-overlay hidden">
    <form class="modal-card" id="login-form" autocomplete="on">
      <div class="app-brand">
        <div class="brand-icon">💬</div>
        <h2>Bienvenido</h2>
        <p id="login-hint">¿Quién eres?</p>
      </div>
      <div class="profiles-grid" id="profiles-grid"></div>
      <input type="hidden" id="login-email" autocomplete="username">
      <input class="login-input hidden" type="password" id="login-pass" placeholder="Clave" autocomplete="current-password" required>
      <p id="login-error" class="login-error hidden"></p>
      <button type="submit" class="login-btn hidden" id="login-btn">Entrar</button>
    </form>
  </div>

  <!-- Chat -->
  <div id="chat-app" class="chat-app hidden">
    <header class="chat-header">
      <div class="header-user-info">
        <div class="current-avatar" id="header-avatar">👤</div>
        <div class="user-details">
          <h3 id="chat-partner-name">…</h3>
          <span class="status-badge">
            <span class="status-dot offline" id="status-dot"></span>
            <span id="status-text">Desconectado</span>
          </span>
        </div>
      </div>
      <div class="header-actions">
        <button class="me-btn" id="me-btn" title="Cambiar mi avatar"></button>
        <button class="icon-btn" id="bell-btn" title="Notificaciones"><i class="fa-solid fa-bell-slash"></i></button>
        <button class="icon-btn" id="logout-btn" title="Cerrar sesión / cambiar usuario">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <div id="net-banner" class="net-banner hidden">Sin conexión — los mensajes se enviarán al volver</div>

    <main class="messages-container" id="messages-container">
      <button id="load-more" class="load-more hidden">Cargar mensajes anteriores</button>
      <div class="welcome-banner">
        <div class="welcome-icon">🔐</div>
        <p>Chat privado entre Papá e Hija.</p>
        <span class="security-tag">Mantén apretado un mensaje para reaccionar ❤️</span>
      </div>
      <div id="messages-list" class="messages-list"></div>
    </main>

    <div id="typing-indicator" class="typing-indicator hidden">
      <span class="typing-dots"><span></span><span></span><span></span></span>
      <span id="typing-text">está escribiendo...</span>
    </div>

    <div id="emoji-panel" class="emoji-panel hidden"></div>

    <form class="chat-input-bar" id="send-form">
      <input type="file" id="file-input" accept="image/*" class="hidden">
      <button type="button" class="icon-btn" id="btn-games" title="Juegos">
        <i class="fa-solid fa-gamepad"></i>
      </button>
      <button type="button" class="icon-btn" id="btn-attach" title="Enviar foto">
        <i class="fa-solid fa-camera"></i>
      </button>
      <div class="input-wrapper">
        <button type="button" class="emoji-toggle" id="btn-emoji" title="Emojis">😊</button>
        <input type="text" id="message-input" placeholder="Escribe un mensaje..." autocomplete="off" enterkeyhint="send" maxlength="4000">
      </div>
      <button type="submit" class="icon-btn send-btn" title="Enviar">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </form>
  </div>

  <!-- Barra de reacciones -->
  <div id="reaction-bar" class="reaction-bar hidden"></div>

  <!-- Elegir avatar -->
  <div id="avatar-modal" class="modal-overlay hidden">
    <div class="modal-card avatar-card">
      <div class="game-head">
        <h3>Elige tu avatar</h3>
        <button class="icon-btn" id="avatar-close" title="Cerrar"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="avatar-grid" class="avatar-grid"></div>
    </div>
  </div>

  <!-- Visor de fotos -->
  <div id="lightbox-modal" class="lightbox-modal hidden">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <img id="lightbox-img" src="" alt="Foto">
    <a id="lightbox-download" href="#" download="foto.jpg" class="lightbox-download-btn">
      <i class="fa-solid fa-download"></i> Descargar foto
    </a>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
